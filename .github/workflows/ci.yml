name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_VW_TYPE2_ID_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdefghijklmnop
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - run: pip install -r requirements-dev.txt
      - run: flake8 --exclude=migrations
      - run: python manage.py compilemessages
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level WARNING
      - run: pytest

  image:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag "$IMAGE" .
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - run: docker push "$IMAGE"
