# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python
image: python:3.6

# This folder is cached between builds
# http://docs.gitlab.com/ce/ci/yaml/README.html#cache
# Will give error output when running gitlab-runner locally:
# https://gitlab.com/gitlab-org/gitlab-runner/issues/4445
cache:
  paths:
    - ~/.cache/pip/
    - ~/.cache/pipenv/

before_script:
  - wget https://github.com/mozilla/geckodriver/releases/download/v0.25.0/geckodriver-v0.25.0-linux64.tar.gz
  - mkdir geckodriver
  - tar -xzf geckodriver-v0.25.0-linux64.tar.gz -C /usr/local/bin
  - geckodriver --version
  - apt-get update && apt-get install -y xvfb firefox-esr x11-utils
  - pip3 install pipenv
  - pipenv install --dev

test:
  stage: test
  script:
    - pipenv run python manage.py test
  variables:
    DJANGO_VW_TYPE2_ID_SECRET_KEY: "dummy_secret_key_testing"
    MOZ_HEADLESS: "1"
